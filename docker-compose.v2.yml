name: civicflow-v2

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: civicflow
      MYSQL_USER: ${DB_USER:-civicflow}
      MYSQL_PASSWORD: ${DB_PASSWORD:-civicflow}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-civicflow-root}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/civicflow.sql:/docker-entrypoint-initdb.d/01-civicflow.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    image: civicflow-backend:v2
    build:
      context: ./backend
      dockerfile: Dockerfile.v2
      args:
        SKIP_TESTS: "true"
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: civicflow
      DB_USER: ${DB_USER:-civicflow}
      DB_PASSWORD: ${DB_PASSWORD:-civicflow}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-AQ.Ab8RN6J7m_dhqfqxD-H0ZCeUdfVlCU2Y2JIwk0sGRQNiXpVbbA}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "${BACKEND_PORT:-8081}:8080"

  frontend:
    image: civicflow-frontend:v2
    build:
      context: ./frontend
      dockerfile: Dockerfile.v2
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  mysql-data:
