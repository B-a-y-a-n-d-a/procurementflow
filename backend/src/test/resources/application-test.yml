spring:
  datasource:
    url: jdbc:h2:mem:civicflow;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop   # tests build the schema from entities; MySQL uses Flyway
  flyway:
    enabled: false

civicflow:
  seed-on-startup: false
  ai:
    gemini-api-key: ""
