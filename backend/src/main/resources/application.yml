server:
  port: ${PORT:8080}
  error:
    include-message: always

spring:
  application:
    name: civicflow-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:civicflow}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:civicflow}
    password: ${DB_PASSWORD:civicflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none          # schema is owned by Flyway (db/migration)
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

civicflow:
  # The database is loaded by importing database/civicflow.sql. Seeding is only used to regenerate that script.
  seed-on-startup: ${SEED_ON_STARTUP:false}
  seed-user-password: ${SEED_USER_PASSWORD:}
  auth:
    token-secret: ${AUTH_TOKEN_SECRET:}   # >= 32 chars; blank = random per start (sign-ins lost on restart)
    token-ttl: ${AUTH_TOKEN_TTL:PT12H}
  organisation:
    name: Mzansi Metro (demo)
    province: Gauteng
  ai:
    gemini-api-key: ${GEMINI_API_KEY:}
    gemini-model: ${GEMINI_MODEL:gemini-2.5-flash}
    gemini-base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
